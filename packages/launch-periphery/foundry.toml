# DeepCoreProtocol launch periphery: `DeepCoreLaunchAndBuy`.
#
# WHY A SINGLE OPTIMIZER SETTING AND NO `compilation_restrictions`.
#
# `packages/launchpad` pins `LaunchpadKitV2` and `LaunchLegs` to 9 000 runs because at
# 1 000 000 they exceed EIP-170. Forge applies a restriction to the WHOLE compilation unit, so
# in that package anything compiled alongside the kit silently becomes 9 000-run bytecode -
# the DEPLOYMENT RULE recorded in CLAUDE.md (2026-09-19), where the same source at the same
# address had a different codehash depending on which script deployed it.
#
# This package's tests deploy the real kit, so the trap would apply here too. It is closed by
# setting ONE optimizer setting for everything: 9 000 runs, package-wide. There is then no
# second profile for a unit to resolve into, `DeepCoreLaunchAndBuy` has exactly one bytecode
# whichever file imports it, and the release script's artifact is the artifact the tests
# measured. CLPositionManager (compiled as a test dependency) also needs 9 000 to fit.
#
# `hp-transient/` is pinned PER PROFILE here and deliberately NOT in a remappings.txt - this
# package ships no remappings.txt at all, so nothing can silently override the profile and
# build the wrong backend. Nothing in `src/` uses the backend; the remapping exists because the
# CI cell asserts that the effective remappings match the profile.

[profile.default]
src = "src"
out = "foundry-out"
solc_version = "0.8.26"
optimizer_runs = 9_000
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
allow_paths = ["../core", "../hooks", "../registry", "../periphery", "../fees", "../launchpad"]
allow_internal_expect_revert = true
gas_limit = "3000000000"
skip = [
    # Default (cancun) build: exclude only the storage backend it does not use.
    "**/transient/storage/**",
]
remappings = [
    "infinity-core/=../core/",
    "infinity-periphery/=../periphery/",
    "deepcore-hooks/=../hooks/",
    "deepcore-registry/=../registry/",
    "deepcore-fees/=../fees/",
    "deepcore-launchpad/=../launchpad/",
    "permit2/=../periphery/lib/permit2",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "openzeppelin-contracts/=../core/lib/openzeppelin-contracts/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "hp-transient/=../core/src/libraries/transient/eip1153/",
]

# Pre-Cancun build. Mirrors packages/core --profile legacy.
[profile.legacy]
src = "src"
out = "foundry-out-legacy"
solc_version = "0.8.26"
optimizer_runs = 9_000
via_ir = true
evm_version = "shanghai"
bytecode_hash = "none"
allow_paths = ["../core", "../hooks", "../registry", "../periphery", "../fees", "../launchpad"]
allow_internal_expect_revert = true
gas_limit = "3000000000"
skip = [
    "**/transient/eip1153/**",
    # OpenZeppelin files using EIP-1153. Mirrors packages/launchpad --profile legacy.
    "**/openzeppelin-contracts/contracts/mocks/**",
    "**/openzeppelin-contracts/contracts/utils/StorageSlot.sol",
    "**/openzeppelin-contracts/contracts/utils/ShortStrings.sol",
    "**/openzeppelin-contracts/contracts/utils/Arrays.sol",
    "**/openzeppelin-contracts/contracts/utils/SlotDerivation.sol",
    "**/openzeppelin-contracts/contracts/utils/ReentrancyGuardTransient.sol",
    "**/openzeppelin-contracts/contracts/proxy/ERC1967/ERC1967Utils.sol",
    "**/openzeppelin-contracts/contracts/token/ERC20/extensions/draft-ERC20TemporaryApproval.sol",
]
remappings = [
    "infinity-core/=../core/",
    "infinity-periphery/=../periphery/",
    "deepcore-hooks/=../hooks/",
    "deepcore-registry/=../registry/",
    "deepcore-fees/=../fees/",
    "deepcore-launchpad/=../launchpad/",
    "permit2/=../periphery/lib/permit2",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "openzeppelin-contracts/=../core/lib/openzeppelin-contracts/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "hp-transient/=../core/src/libraries/transient/storage/",
]

[fuzz]
runs = 256
