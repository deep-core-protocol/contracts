[profile.default]
# Every remapping below is explicit, as under legacy. Auto-detection walked the nested upstream
# lib/infinity-core (initialized in some trees) and added forge-gas-snapshot/, erc4626-tests/ and
# halmos-cheatcodes/ from the UNHARDENED core. Nothing here imports them, and nothing may
# silently start resolving through that tree.
auto_detect_remappings = false
allow_paths = ["../core"]
skip = [
    # Default (cancun) build: exclude only the storage backend it does not use.
    # NOTE: do NOT skip */core/test/* here - periphery's own tests import core test
    # helpers (TokenFixture, CLPoolManagerRouter) via the infinity-core/ remapping.
    "**/transient/storage/**",
]
remappings = [
    "infinity-core/=../core/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "forge-std/=../core/lib/forge-std/src/",
    "openzeppelin-contracts/=../core/lib/openzeppelin-contracts/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "permit2/=lib/permit2",
    # Deploy scripts import `pancake-create3-factory/src/...`. Pinned explicitly: without it the
    # prefix resolved only through remappings auto-detected from the NESTED upstream
    # lib/infinity-core, and a clean checkout auto-detects `.../src/` and fails with src/src.
    "pancake-create3-factory/=lib/pancake-create3-factory/",
    "hp-transient/=../core/src/libraries/transient/eip1153/",
]
src = 'src'
out = 'foundry-out'
solc_version = '0.8.26'
optimizer_runs = 1_000_000
via_ir = true
ffi = true
gas_limit = "3000000000"
fs_permissions = [
    { access = "read-write", path = ".forge-snapshots/" },
    { access = "read", path = "./foundry-out" },
    { access = "read", path = "./script/config" },
    { access = "read", path = "./test/bin/" },
]
evm_version = 'cancun'
bytecode_hash = "none"

# added due to v1.0 foundry
# ref: https://book.getfoundry.sh/guides/v1.0-migration#expect-revert-cheatcode-disabled-on-internal-calls-by-default
allow_internal_expect_revert = true

additional_compiler_profiles = [
  { name = "clPosm", optimizer_runs = 9000 }
]

compilation_restrictions = [
  { paths = "src/pool-cl/CLPositionManager.sol", optimizer_runs = 9000 }
]

[fuzz]
runs = 5 # change this for higher number of fuzz runs locally

[invariant]
runs = 5 # change this for higher number of invariant runs locally
depth = 5 # default is 500: https://github.com/foundry-rs/foundry/pull/7957

[profile.ci.invariant]
runs = 100            # The number of calls to make in the invariant tests

[profile.ci_main.fuzz]
runs = 1000

[profile.ci_main.invariant]
runs = 1000           # The number of calls to make in the invariant tests


# DeepCoreProtocol: pre-Cancun build. Mirrors packages/core --profile legacy.
[profile.legacy]
auto_detect_remappings = false
allow_paths = ["../core"]
src = "src"
out = "foundry-out-legacy"
solc_version = "0.8.26"
optimizer_runs = 1_000_000
via_ir = true
ffi = true
evm_version = "shanghai"
gas_limit = "3000000000"
bytecode_hash = "none"
allow_internal_expect_revert = true
skip = [
    "**/transient/eip1153/**",
    # OpenZeppelin files using EIP-1153. None are reachable from this package's own imports
    # (Ownable / IERC20 / IERC721 / SafeCast / Strings); forge compiles them only because it
    # walks the whole ../core tree as sources. Skipping the transient users and everything
    # importing StorageSlot keeps the shanghai build clean without touching lib/ submodules.
    "**/openzeppelin-contracts/contracts/mocks/**",
    "**/openzeppelin-contracts/contracts/utils/StorageSlot.sol",
    "**/openzeppelin-contracts/contracts/utils/ShortStrings.sol",
    "**/openzeppelin-contracts/contracts/utils/Arrays.sol",
    "**/openzeppelin-contracts/contracts/utils/SlotDerivation.sol",
    "**/openzeppelin-contracts/contracts/utils/ReentrancyGuardTransient.sol",
    "**/openzeppelin-contracts/contracts/proxy/ERC1967/ERC1967Utils.sol",
    "**/openzeppelin-contracts/contracts/token/ERC20/extensions/draft-ERC20TemporaryApproval.sol",
]
remappings = [
    "infinity-core/=../core/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "forge-std/=../core/lib/forge-std/src/",
    "openzeppelin-contracts/=../core/lib/openzeppelin-contracts/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "permit2/=lib/permit2",
    # Same as default. This profile has auto_detect_remappings = false, so without this line the
    # deploy scripts do not compile under legacy at all.
    "pancake-create3-factory/=lib/pancake-create3-factory/",
    "hp-transient/=../core/src/libraries/transient/storage/",
]
# Gas snapshots are backend-specific. Without this, every legacy `forge test` overwrites the
# tracked default-profile snapshots/*.json with SSTORE-priced numbers.
snapshots = "snapshots-legacy"