# DeepCoreProtocol routing: the fee-taking fill front end for third-party venues.
#
# This package imports NOTHING from ../core or ../periphery. It is not a Vault app, it takes no
# lock, and it contains no settlement code. It still carries both profiles, because the house rule
# is that every package does and CI is a per-package x per-profile matrix.
#
# `hp-transient/` is pinned PER PROFILE here and deliberately NOT in a remappings.txt - this
# package ships no remappings.txt at all, so there is nothing that can silently override the
# profile and build the wrong backend. Nothing here uses the backend; the remapping exists so the
# CI cell's "effective remappings match the profile" check has something true to assert.

[profile.default]
src = "src"
out = "foundry-out"
solc_version = "0.8.26"
optimizer_runs = 800
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
allow_paths = ["../core", "../hooks"]
allow_internal_expect_revert = true
remappings = [
    # script/DeployDeepCoreFillRouter.s.sol deploys through CreateX with the shared helper in
    # packages/hooks. That file imports forge-std and nothing else, so no hook, core or
    # periphery source is pulled into this package by it.
    "deepcore-hooks/=../hooks/",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "openzeppelin-contracts/=../core/lib/openzeppelin-contracts/",
    "hp-transient/=../core/src/libraries/transient/eip1153/",
]

# Pre-Cancun build. Mirrors packages/core --profile legacy.
[profile.legacy]
src = "src"
out = "foundry-out-legacy"
solc_version = "0.8.26"
optimizer_runs = 800
via_ir = true
evm_version = "shanghai"
bytecode_hash = "none"
allow_paths = ["../core", "../hooks"]
allow_internal_expect_revert = true
skip = [
    # OpenZeppelin files using EIP-1153. None are reachable from this package's own imports;
    # forge compiles them only because it walks the whole ../core tree as sources.
    "**/openzeppelin-contracts/contracts/mocks/**",
    "**/openzeppelin-contracts/contracts/utils/StorageSlot.sol",
    "**/openzeppelin-contracts/contracts/utils/ShortStrings.sol",
    "**/openzeppelin-contracts/contracts/utils/Arrays.sol",
    "**/openzeppelin-contracts/contracts/utils/SlotDerivation.sol",
    "**/openzeppelin-contracts/contracts/utils/ReentrancyGuardTransient.sol",
    "**/openzeppelin-contracts/contracts/proxy/ERC1967/ERC1967Utils.sol",
    "**/openzeppelin-contracts/contracts/token/ERC20/extensions/draft-ERC20TemporaryApproval.sol",
]
remappings = [
    # script/DeployDeepCoreFillRouter.s.sol deploys through CreateX with the shared helper in
    # packages/hooks. That file imports forge-std and nothing else, so no hook, core or
    # periphery source is pulled into this package by it.
    "deepcore-hooks/=../hooks/",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "openzeppelin-contracts/=../core/lib/openzeppelin-contracts/",
    "hp-transient/=../core/src/libraries/transient/storage/",
]

[fuzz]
runs = 256
