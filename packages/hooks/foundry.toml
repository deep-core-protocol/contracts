[profile.default]
src = "src"
out = "foundry-out"
solc_version = "0.8.26"
optimizer_runs = 25_666
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
allow_paths = ["../core"]
allow_internal_expect_revert = true
fs_permissions = [
    # test/docs/DocsClaims.t.sol reads the published docs snippet to prove the
    # committed fixture has not drifted from the page.
    { access = "read", path = "./test" },
    { access = "read", path = "../../apps/web/src/routes/docs" },
]
remappings = [
    "infinity-core/=../core/",
    "deepcore-hooks/=./",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "hp-transient/=../core/src/libraries/transient/eip1153/",
]

[profile.legacy]
src = "src"
out = "foundry-out-legacy"
solc_version = "0.8.26"
optimizer_runs = 25_666
via_ir = true
evm_version = "shanghai"
bytecode_hash = "none"
allow_paths = ["../core"]
allow_internal_expect_revert = true
fs_permissions = [
    # test/docs/DocsClaims.t.sol reads the published docs snippet to prove the
    # committed fixture has not drifted from the page.
    { access = "read", path = "./test" },
    { access = "read", path = "../../apps/web/src/routes/docs" },
]
remappings = [
    "infinity-core/=../core/",
    "deepcore-hooks/=./",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "hp-transient/=../core/src/libraries/transient/storage/",
]
